# Blueprint de Render para SGED.
#
# Render lee este fichero desde la raíz del repositorio y crea los cuatro
# recursos de una sola vez, así que el despliegue queda versionado y
# reproducible en vez de depender de lo que alguien haya hecho a mano en el
# panel.
#
# Todo vive en Render: no hacen falta cuentas en otros proveedores.
#
# ADVERTENCIA SOBRE LA BASE DE DATOS: el plan gratuito de Render Postgres
# CADUCA 30 DÍAS DESPUÉS DE CREARSE y con él se pierden los datos. Es una
# decisión consciente para esta entrega, no un descuido: si el sistema debe
# seguir en pie más allá de ese plazo hay que migrar a un plan de pago o a un
# proveedor cuyo plan gratuito no expire (ver render.md). Anota la fecha de
# creación.
#
# Por qué el frontend es un sitio estático y no un contenedor: Render da 750
# horas de instancia gratis por mes para TODO el workspace. Un contenedor de
# nginx consumiría de esa bolsa sin necesidad, porque lo único que hace es
# servir ficheros y reenviar /api. Como sitio estático no consume horas, y
# las reglas de reescritura cubren ambas funciones. Así la bolsa entera queda
# para el backend, que es quien de verdad la necesita.

databases:
  - name: sged-postgres
    plan: free
    region: oregon
    databaseName: sged_db
    postgresMajorVersion: "16"

services:

  # ----------------------------------------------------------------
  # Backend Spring Boot
  # ----------------------------------------------------------------
  - type: web
    name: sged-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      # Las migraciones de Flyway no reconstruyen la base desde cero -ninguna
      # crea deportivo.categorias aunque V7, V16 y V17 la referencian-, así
      # que el esquema se aplica una vez desde db/schema.sql. Encenderlo aquí
      # haría fallar el arranque.
      - key: FLYWAY_ENABLED
        value: "false"

      # Render sirve HTTPS real, así que las cookies van marcadas Secure. Sin
      # esto viajan sin ese atributo y se incumple el Bloque A.1.
      - key: COOKIE_SECURE
        value: "true"

      - key: SERVER_PORT
        value: "8080"

      # Sin esto el backend cae al valor por defecto de SecurityConfig, que
      # solo trae los localhost de desarrollo: el navegador nunca llega
      # directo a sged-backend.onrender.com salvo prueba manual, porque la
      # reescritura /api/* del sitio estatico lo hace del lado del servidor
      # y ahi CORS no aplica -pero declarar el origen real es lo correcto
      # para esa prueba manual y para no depender de ese detalle de Render.
      # Sin comodin: *.onrender.com habilitaria credenciales cruzadas desde
      # cualquier otro servicio de Render, no solo el propio.
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: "https://sged-frontend.onrender.com"

      # springdoc 2.3.0 empaqueta una copia vieja de Swagger UI con DOMPurify
      # 3.0.6, que ZAP marca como "Vulnerable JS Library" (severidad alta).
      # La UI interactiva no la necesita nadie en el ambiente publico -no es
      # un requisito de la guia-, asi que se apaga ahi en vez de esperar a
      # que springdoc actualice su bundle. Sigue disponible en local
      # (application.yml la deja encendida por defecto).
      - key: SPRINGDOC_ENABLED
        value: "false"

      # Redis por la red privada del workspace: no sale a internet, por eso
      # sin TLS.
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: sged-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: sged-redis
          property: port
      - key: REDIS_SSL
        value: "false"

      # Se genera solo y nunca se escribe en el repositorio.
      - key: JWT_SECRET
        generateValue: true

      # Render entrega la cadena en formato postgres://, que Spring no acepta
      # como spring.datasource.url -necesita el prefijo jdbc:-. Se deja aquí
      # para tenerla a mano al construir DB_URL y para depurar.
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: sged-postgres
          property: connectionString

      # Estos tres se completan una sola vez en el panel al crear el
      # Blueprint, con los datos que Render muestra para sged-postgres.
      # Ver docs/despliegue/render.md, paso 2.
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false

      # Opcionales: solo si se va a mostrar la retroalimentación por IA.
      - key: GEMINI_API_KEY
        sync: false
      - key: IA_HABILITADO
        value: "false"

  # ----------------------------------------------------------------
  # Redis (caché de Spring y tokens de QR)
  # ----------------------------------------------------------------
  - type: keyvalue
    name: sged-redis
    plan: free
    region: oregon
    # Obligatorio para Key Value. Vacío = solo lo alcanza el backend por la
    # red privada, nunca desde internet.
    ipAllowList: []

  # ----------------------------------------------------------------
  # Frontend Angular (sitio estático)
  # ----------------------------------------------------------------
  - type: web
    name: sged-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist/frontend/browser
    routes:
      # El orden importa: Render aplica la PRIMERA regla que coincida. Si el
      # comodín de la SPA fuera primero, se tragaría también /api.
      #
      # Es reescritura y no redirección: el navegador sigue viendo el dominio
      # del frontend, así que la API queda en el mismo origen y las cookies
      # SameSite=Strict siguen funcionando.
      - type: rewrite
        source: /api/*
        destination: https://sged-backend.onrender.com/api/*

      # Enrutado del lado del cliente: cualquier ruta desconocida devuelve
      # index.html. Render no aplica reglas si existe un fichero en esa ruta,
      # así que los bundles se sirven directo.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
