# Blueprint de Render para SGED.
#
# Render lee este fichero desde la raíz del repositorio y crea los recursos
# de una sola vez, así que el despliegue queda versionado y reproducible en
# vez de depender de lo que alguien haya hecho a mano en el panel.
#
# BASE DE DATOS: PostgreSQL gestionado en Supabase, NO en Render. El plan
# gratuito de Render Postgres caduca a los 30 días de crearse y con él se
# pierden los datos; Supabase no expira así. La cadena de conexión por
# defecto del repo (.env.example) ya apunta a Supabase. Este blueprint no
# crea ninguna base: DB_URL / DB_USER / DB_PASSWORD se completan a mano en
# el panel con los datos del proyecto de Supabase (ver docs/despliegue/render.md).
#
# El esquema se carga UNA vez con `psql ... -f db/schema.sql` (más
# db/seed.sql) porque las migraciones de Flyway no reconstruyen la base
# desde cero; por eso FLYWAY_ENABLED va en "false".
#
# Por qué el frontend es un sitio estático y no un contenedor: Render da 750
# horas de instancia gratis por mes para TODO el workspace. Un contenedor de
# nginx consumiría de esa bolsa sin necesidad, porque lo único que hace es
# servir ficheros y reenviar /api. Como sitio estático no consume horas, y
# las reglas de reescritura cubren ambas funciones. Así la bolsa entera queda
# para el backend, que es quien de verdad la necesita.

services:

  # ----------------------------------------------------------------
  # Backend Spring Boot
  # ----------------------------------------------------------------
  - type: web
    name: sged-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      # Las migraciones de Flyway no reconstruyen la base desde cero -ninguna
      # crea deportivo.categorias aunque V7, V16 y V17 la referencian-, así
      # que el esquema se aplica una vez desde db/schema.sql. Encenderlo aquí
      # haría fallar el arranque.
      - key: FLYWAY_ENABLED
        value: "false"

      # Render sirve HTTPS real, así que las cookies van marcadas Secure. Sin
      # esto viajan sin ese atributo y se incumple el Bloque A.1.
      - key: COOKIE_SECURE
        value: "true"

      - key: SERVER_PORT
        value: "8080"

      # Origen del frontend desplegado. Render asigno el sufijo -r2rs porque
      # el nombre "sged-frontend" ya estaba tomado a nivel global en
      # .onrender.com (otro despliegue del equipo); el nombre real del
      # servicio en este blueprint sigue siendo sged-frontend.
      # Sin comodin: *.onrender.com habilitaria credenciales cruzadas desde
      # cualquier otro servicio de Render, no solo el propio.
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: "https://sged-frontend-r2rs.onrender.com"

      # springdoc 2.3.0 empaqueta una copia vieja de Swagger UI con DOMPurify
      # 3.0.6, que ZAP marca como "Vulnerable JS Library" (severidad alta).
      # La UI interactiva no la necesita nadie en el ambiente publico -no es
      # un requisito de la guia-, asi que se apaga ahi en vez de esperar a
      # que springdoc actualice su bundle. Sigue disponible en local
      # (application.yml la deja encendida por defecto).
      - key: SPRINGDOC_ENABLED
        value: "false"

      # Redis (Key Value de Render) por la red privada del workspace. Se pasa
      # la cadena completa -rediss://:password@host:port- en vez de host/port
      # sueltos: el Key Value exige AUTH aunque no salga a internet, y ese
      # dato solo lo entrega la propiedad connectionString. Spring Data Redis
      # toma spring.data.redis.url con prioridad sobre host/port/password.
      - key: SPRING_DATA_REDIS_URL
        fromService:
          type: keyvalue
          name: sged-redis
          property: connectionString

      # Se genera solo y nunca se escribe en el repositorio.
      - key: JWT_SECRET
        generateValue: true

      # application.yml exige estas sin valor por defecto: si faltan, el
      # backend arranca y se mata con "Could not resolve placeholder". Los
      # valores son los de .env.example (JWT RFC 7519, control de fuerza
      # bruta del login, TTL de la caché de lecturas).
      - key: JWT_EXPIRATION_MS
        value: "3600000"
      - key: JWT_REFRESH_EXPIRATION_MS
        value: "604800000"
      - key: JWT_ISSUER
        value: "sged-backend"
      - key: JWT_AUDIENCE
        value: "sged-frontend"
      - key: LOGIN_MAX_INTENTOS
        value: "5"
      - key: LOGIN_VENTANA_MINUTOS
        value: "15"
      - key: CACHE_TTL_SECONDS
        value: "60"

      # Base de datos en Supabase (no Render). Se completan una sola vez en
      # el panel al crear el Blueprint. Ver docs/despliegue/render.md, paso 2:
      #   DB_URL      jdbc:postgresql://<host>.pooler.supabase.com:6543/postgres?prepareThreshold=0&preparedStatementCacheQueries=0
      #   DB_USER     postgres.<id-del-proyecto>
      #   DB_PASSWORD la contraseña del proyecto de Supabase
      # El puerto 6543 es el Transaction Pooler (uso normal de la app); el
      # esquema se carga aparte por el 5432 (ver render.md).
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false

      # Opcionales: solo si se va a mostrar la retroalimentación por IA.
      - key: GEMINI_API_KEY
        sync: false
      - key: IA_HABILITADO
        value: "false"

  # ----------------------------------------------------------------
  # Redis (caché de Spring y tokens de QR)
  # ----------------------------------------------------------------
  - type: keyvalue
    name: sged-redis
    plan: free
    region: oregon
    # Obligatorio para Key Value. Vacío = solo lo alcanza el backend por la
    # red privada, nunca desde internet.
    ipAllowList: []

  # ----------------------------------------------------------------
  # Frontend Angular (sitio estático)
  # ----------------------------------------------------------------
  - type: web
    name: sged-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist/frontend/browser
    routes:
      # El orden importa: Render aplica la PRIMERA regla que coincida. Si el
      # comodín de la SPA fuera primero, se tragaría también /api.
      #
      # Es reescritura y no redirección: el navegador sigue viendo el dominio
      # del frontend, así que la API queda en el mismo origen y las cookies
      # SameSite=Strict siguen funcionando.
      # El backend quedo con sufijo -2p05: el nombre "sged-backend" ya
      # estaba tomado a nivel global en .onrender.com. Si se re-crea el
      # blueprint desde cero, Render asigna otro sufijo y hay que
      # actualizar esta linea y CORS_ALLOWED_ORIGIN_PATTERNS de arriba.
      - type: rewrite
        source: /api/*
        destination: https://sged-backend-2p05.onrender.com/api/*

      # Enrutado del lado del cliente: cualquier ruta desconocida devuelve
      # index.html. Render no aplica reglas si existe un fichero en esa ruta,
      # así que los bundles se sirven directo.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
