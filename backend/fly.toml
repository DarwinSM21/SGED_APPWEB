# Backend SGED en Fly.io.
#
# No declara servicios publicos a proposito: la unica puerta de entrada es el
# frontend, que hace proxy de /api por la red privada de Fly. Publicar tambien
# el backend duplicaria la superficie expuesta y romperia las cookies, que son
# SameSite=Strict y necesitan un solo origen.

app = "sged-backend"
primary_region = "mia"          # Miami, el mas cercano a Ecuador; cambiable

[build]
  dockerfile = "Dockerfile"

[env]
  # El esquema se aplica una vez a mano con db/schema.sql: las migraciones de
  # Flyway no reconstruyen la base desde cero (deportivo.categorias no la crea
  # ninguna). Encenderlo aqui haria fallar el arranque.
  FLYWAY_ENABLED = "false"

  # Fly sirve HTTPS de verdad, asi que las cookies van marcadas Secure.
  COOKIE_SECURE = "true"

  # Redis gestionado: siempre con TLS.
  REDIS_SSL = "true"
  REDIS_PORT = "6379"

  SERVER_PORT = "8080"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"              # Spring Boot no arranca comodo en 256 MB

# Chequeo sobre la red privada; no requiere IP publica.
[checks]
  [checks.salud]
    type = "http"
    port = 8080
    path = "/actuator/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
