server:
  # El TLS real lo termina nginx (Bloque C.2, OWASP A02); el backend recibe
  # trafico plano dentro de la red de Docker. Sin esto, request.isSecure()
  # siempre daria false y Spring Security nunca emitiria HSTS.
  forward-headers-strategy: framework

spring:
  cache:
    type: redis
    
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: seguridad

  flyway:
    enabled: ${FLYWAY_ENABLED}
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: seguridad
    # Conexion propia para migrar, separada de spring.datasource. Por
    # defecto son la misma (Docker/Postgres local: no hace falta nada
    # mas). En Supabase, DB_URL apunta al Transaction Pooler (6543) para
    # el uso normal de la app, pero ese modo de PgBouncer no sostiene
    # advisory locks de sesion -lo que Flyway necesita para migrar-, asi
    # que ahi conviene apuntar FLYWAY_DB_URL al Session Pooler (mismo
    # host, puerto 5432) o a la conexion directa. Ver .env.example.
    url: ${FLYWAY_DB_URL:${DB_URL}}
    user: ${FLYWAY_DB_USER:${DB_USER}}
    password: ${FLYWAY_DB_PASSWORD:${DB_PASSWORD}}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Vacios en desarrollo -el Redis de docker-compose no pide nada- y
      # obligatorios en cualquier Redis gestionado, que solo acepta TLS y
      # contrasena. Sin estos dos, el despliegue remoto falla al conectar.
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

# Generacion de texto con modelo de lenguaje (modulo Entrenador).
# Deshabilitada por defecto: el sistema debe funcionar completo sin ella.
# Solo se envian datos seudonimizados (ver PerfilJugadorAnonimo).
ia:
  # Que proveedor genera el texto: 'gemini' u 'openai'. Solo se crea el bean
  # del elegido, asi que cambiar de proveedor no toca ni una linea del dominio
  # -PlantillaService depende de la interfaz GeneradorFeedbackIA, no de una
  # implementacion concreta-.
  proveedor: ${IA_PROVEEDOR:gemini}

  openai:
    # La clave NO se escribe aqui: se pone en .env, que esta fuera de git.
    api-key: ${OPENAI_API_KEY:}
    # Sirve para cualquier API compatible con OpenAI, no solo la de OpenAI:
    #   OpenAI      https://api.openai.com/v1
    #   Groq        https://api.groq.com/openai/v1
    #   OpenRouter  https://openrouter.ai/api/v1
    #   NVIDIA NIM  https://integrate.api.nvidia.com/v1
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    modelo: ${OPENAI_MODELO:gpt-4o-mini}
    timeout-segundos: ${IA_TIMEOUT_SEGUNDOS:10}
    reintentos: ${IA_REINTENTOS:1}

  gemini:
    habilitado: ${IA_HABILITADO:false}
    api-key: ${GEMINI_API_KEY:}
    # gemini-2.0-flash ya no tiene nivel gratuito para keys nuevas (ver .env.example).
    modelo: ${GEMINI_MODELO:gemini-flash-latest}
    # Los modelos "-latest" piensan antes de responder (~5,7s medidos en una
    # generacion real), asi que 8s queda ajustado y 10s deja margen.
    #
    # Lo que manda aqui no es el caso bueno sino el malo: el nivel gratuito de
    # Gemini devuelve 503 "high demand" de forma intermitente (medido: 200,
    # 503, 200, 503, timeout en cinco peticiones identicas). Con 15s y dos
    # reintentos, rendirse costaba ~45s de pantalla congelada. Con 10s y un
    # reintento el aviso "IA no disponible" aparece en ~21s en el peor caso,
    # y el 503 -que vuelve en ~2,4s- sigue teniendo su segunda oportunidad.
    timeout-segundos: ${IA_TIMEOUT_SEGUNDOS:10}
    reintentos: ${IA_REINTENTOS:1}

asistencia:
  qr:
    ttl-segundos: ${ASISTENCIA_QR_TTL_SEGUNDOS:60}
  # Minutos de gracia despues de hora_inicio antes de marcar TARDE en vez de
  # PRESENTE. Sin hora_inicio programada (sesion sin horario fijo), siempre
  # se marca PRESENTE: no hay contra que medir la tardanza.
  tolerancia-tarde-minutos: ${ASISTENCIA_TOLERANCIA_TARDE_MINUTOS:10}

security:
  cookie:
    secure: ${COOKIE_SECURE:true}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS}
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
  login:
    max-intentos: ${LOGIN_MAX_INTENTOS}
    ventana-minutos: ${LOGIN_VENTANA_MINUTOS}

cache:
  estudiantes:
    ttl-seconds: ${CACHE_TTL_SECONDS}
  entrenadores:
    ttl-seconds: ${CACHE_TTL_SECONDS}
  usuarios:
    ttl-seconds: ${CACHE_TTL_SECONDS}

springdoc:
  api-docs:
    path: /api/docs.json
  swagger-ui:
    path: /api/docs
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
