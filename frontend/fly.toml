# Frontend SGED en Fly.io: sirve la SPA y hace de puerta unica hacia la API.

app = "sged-frontend"
primary_region = "mia"          # debe coincidir con el backend

[build]
  dockerfile = "Dockerfile.fly" # sin certificado autofirmado; TLS lo pone Fly

[env]
  # Destino del proxy /api. Va por variable y no escrito en la config para
  # que nginx resuelva el DNS en cada peticion: con el nombre literal, nginx
  # aborta al arrancar si el backend no existe todavia (comprobado).
  BACKEND_UPSTREAM = "sged-backend.internal:8080"

  # DNS privado de Fly. Confirmalo dentro de una maquina con:
  #   fly ssh console -a sged-frontend -C "cat /etc/resolv.conf"
  DNS_RESOLVER = "[fdaa::3]:53"

[http_service]
  internal_port = 8080
  force_https = true            # redirige HTTP a HTTPS
  auto_stop_machines = "stop"   # se apaga sin trafico y se enciende al pedido
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"              # nginx sirviendo estaticos pide poco
