# Variante de nginx.conf solo para el despliegue en Fly.io — nginx.conf
# (el original) sigue siendo el que usa docker-compose para desarrollo
# local, sin tocar. Dos diferencias a propósito:
#
# 1. Un solo server block en el puerto 80, sin certificado autofirmado:
#    Fly Proxy termina TLS en su borde y entrega HTTPS real (Let's
#    Encrypt) para el dominio *.fly.dev o el dominio propio que se
#    configure — no hace falta (ni sirve) el certificado de desarrollo
#    de dev.crt/dev.key aquí.
# 2. proxy_pass apunta a la URL pública del backend en Fly, no a
#    "backend:8080": las dos apps no comparten red Docker, son dos apps
#    de Fly independientes. CAMBIAR sged-profutbol-api.fly.dev si el
#    nombre de la app del backend terminó siendo otro (ver backend/fly.toml).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://sged-profutbol-api.fly.dev/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host sged-profutbol-api.fly.dev;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass https://sged-profutbol-api.fly.dev/actuator/;
        proxy_ssl_server_name on;
        proxy_set_header Host sged-profutbol-api.fly.dev;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
