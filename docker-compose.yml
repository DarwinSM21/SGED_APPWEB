# SGED - Orquestación (Entrega 3, Bloque B.1)
# Las imágenes deben quedar pinadas por digest sha256.
# Ejecute una vez:  ./scripts/pin-digests.sh   (reescribe los digests reales)
services:

  postgres:
    image: postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    container_name: sged_postgres
    environment:
      POSTGRES_DB: sged_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Bloque B.1: esquema, seed y procedimientos aplicados por initdb
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d sged_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis@sha256:a8f08480e1f88f2647fed492d1178c06abb0d0c1fbf02c682a61e2f483fb3954
    container_name: sged_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sged_backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/sged_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FLYWAY_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sged_frontend
    ports:
      - "4200:80"
      - "8443:443"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
